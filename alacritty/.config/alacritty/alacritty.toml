[env]
term = "xterm-256color"

[font]
size = 14.0

[keyboard]
bindings = [ { key = "Return", mods = "Shift", chars = "\n" } ]

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold" # Adjust if your font's bold style has a different name (e.g., "ExtraBold")

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic" # Adjust if your font's bold italic style has a different name

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular" # Adjust if your font's regular style has a different name (e.g., "Book")

[colors.bright]
black = "#444b6a"
blue = "#7da6ff"
cyan = "#0db9d7"
green = "#b9f27c"
magenta = "#bb9af7"
red = "#ff7a93"
white = "#acb0d0"
yellow = "#ff9e64"

[colors.normal]
black = "#32344a"
blue = "#7aa2f7"
cyan = "#449dab"
green = "#9ece6a"
magenta = "#ad8ee6"
red = "#f7768e"
white = "#787c99"
yellow = "#e0af68"

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"


